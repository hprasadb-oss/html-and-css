<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { 
            font-family: Arial;
            background: #f0f4ff;
            padding:30px;
            text-align:center;

        } h1 {color:#ff5a43;}
        p {color: #555} 
        .cards {
            display:flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px
        }
        .card {
            background: white;
            border: 3px solid #ff5a43;
            border-radius: 12px;
            padding: 20px;
            width:200px;
        }
        .planet-name {
        font-size:22px ;
        font-weight: bold;
        color: #333;
        }


    </style>
</head>
<body>
 <h1>My Planet Cards</h1>   
 <p>Use A Javascript class to build planet cards</p>
 <button onclick="showPlanets()">Show Planets!</button>
 <div class="cards">
    <div id="card1"></div>
    <div id="card2"></div>
    <div id="card3"></div>
    <div id="card4"></div>
    <div id="card5"></div>
    </div>
    <script>
        class Planet {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }
        function showPlanets() {
          let p1 = new Planet("Earth","the only planet ith life");
          let p2 = new Planet("Mars","Known as the red planet") ;
          let p3 = new Planet("saturn","Has rings made of ice");
          let p4 = new Planet("neptune","Neptune is over 30 times farther from the Sun than Earth.")
          let p5 = new Planet("sun","the sun is Approximately 4.6 billion years old.")

          document.getElementById("card1").innerHTML =
          "<div class='card'><div class='Planet-name'>" + p1.name + "</div>"  +
          "<div class=planet-fact'>" + p1.describe() + "</div></div>";

          document.getElementById("card2").innerHTML =
          "<div class='card'><div class='Planet-name'>" + p2.name + "</div>"  +
          "<div class=planet-fact'>" + p2.describe() + "</div></div>";

           document.getElementById("card3").innerHTML =
            "<div class='card'><div class='Planet-name'>" + p3.name + "</div>"  +
          "<div class=planet-fact'>" + p3.describe() + "</div></div>";

          document.getElementById("card4").innerHTML =
            "<div class='card'><div class='Planet-name'>" + p4.name + "</div>"  +
          "<div class=planet-fact'>" + p4.describe() + "</div></div>";


          document.getElementById("card5").innerHTML =
            "<div class='card'><div class='Planet-name'>" + p5.name + "</div>"  +
          "<div class=planet-fact'>" + p5.describe() + "</div></div>";
        }
        
        
    </script>
 </div>
</body>
</html>
