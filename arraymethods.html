<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h2>javascript array methods</h2>  
  <h2>join() and pop</h2>
  <p> the join() method joins array elements into a string and the pop() metthod removes the last elementfrom an array. </p>
  <p id="myjoin"></p>
  <p id="myfirstpop"></p>
  <p id="mysecondpop"></p>
  <script>
    var fruits =["banana","orange","apple","mango"];
    document.getElementById("myjoin").innerHTML = fruits.join("*");
    document.getElementById("myfirstpop").innerHTML = fruits;
    fruits.pop();
    document.getElementById("mysecondpop").innerHTML = fruits;
    </script>
</body>
</html>
