<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Favourite Person Profile</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f0f0f2;
    }

    h1 {
      color: #ff5a43;
    }

    .card-label {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
    }

    pre {
      font-size: 13px;
      color: #333;
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      max-width: 400px;
    }
  </style>
</head>

<body class="py-4">
  <div class="container">

    <h1 class="mb-1">My Favourite Person Profile</h1>

    <p class="text-muted mb-4">
      Introduction to Objects in JavaScript
    </p>

    <div class="card shadow-sm mb-3" style="max-width: 400px;">
      <div class="card-body">
        <h5 class="card-title" style="color: #ff5a43;">
          Profile Details
        </h5>

        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <span class="card-label d-block">Name</span>
            <strong id="name"></strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">Relationship</span>
            <strong id="relationship"></strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">Favourite Activity</span>
            <strong id="activity"></strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">City</span>
            <strong id="city"></strong>
          </li>
        </ul>
      </div>
    </div>

    <h2>JavaScript Object Used</h2>
    <pre id="objectBox"></pre>

  </div>

  <script>
    const favouritePerson = {
      name: "Haanshika",
      relationship: "Best Friend",
      activity: "Drawing",
      city: "Delhi"
    };

    // Dot notation
    document.getElementById("name").textContent =
      favouritePerson.name;

    document.getElementById("relationship").textContent =
      favouritePerson.relationship;

    // Bracket notation
    document.getElementById("activity").textContent =
      favouritePerson["activity"];

    document.getElementById("city").textContent =
      favouritePerson["city"];

    // Show the complete object
    document.getElementById("objectBox").textContent =
      JSON.stringify(favouritePerson, null, 2);
  </script>
</body>
</html>
